
# A block-placing wand that places a specific block.
block_wand:
  xbuilder:
    name: "<!i>&aBlock Wand"
    lore: |
      <!i><gray>Replaces a Logged block when Right clicked.
      <!i><gold>Log a block when Shift-Right clicked.
    material: STICK
  sertraline:
    tier: C
    vars:
      block_type: "STONE" # The block type to place
    actions:
      onRightClick:
        - async: false
          js: |
            // Get the block the player is looking at.
            var block = player.getTargetBlockExact(16); // Range of 16 blocks.
            if (!player.isSneaking()) {

              // Check if the block is air.
              if (block != null && !block.isAir) {
              
                var success = false;

                // Set the block type.
                try {
                  block.setType(org.bukkit.Material.valueOf(block_type), false);
                  success = true
                } catch (e) {
                                      PlayerUtil.sendActionBar(player, mmUtil.deserialize("<red>Invalid block type: " + block_type));
                }
                if (success) {
                                      PlayerUtil.sendActionBar(player, mmUtil.deserialize("<green>Block placed!"));
                }
              } else {
                                  PlayerUtil.sendActionBar(player, mmUtil.deserialize("<red>Too far away! (>16 blocks)"));
              }
            } else {

              var tag = ItemStackUtil.getItemTag(bItem);
              var target = block.type

                              PlayerUtil.sendActionBar(player, mmUtil.deserialize("<dark_aqua>Logged blocks: " + target + " successfully."));

              // Modify item stored data.
              tag.putDeep("sertraline_data.block_type", target.toString());

              // Save data
              ItemStackUtil.setItemTagDirect(bItem, tag);

            }

