# ─────────────────────────────────────────────────────────────
#  A single English example item using the comparison lore format
#  (see lore-formats/compare_example.yml -> comparable_item).
#
#  When skyline_sword's lore is (re)rendered, it compares its own
#  attribute values against the item the player currently has equipped
#  in the slot named by sertraline.compare-path.
#
#  sertraline.compare-path  = the target EQUIPMENT SLOT (e.g. MAIN_HAND,
#                             OFF_HAND, HEAD, CHEST, ...). "MAIN_HAND" / "HAND"
#                             both mean the main hand. There is NO template
#                             reference item — the target is whatever is in
#                             that slot on the player right now.
#  sertraline.vals.*        = this item's own values, read as sertraline:vals.attack_damage.
#
#  Per attribute, the target's value is read from the same path, and the
#  conditions in comparable_item decide the result string from the diff:
#    diff == 0                  -> "equal"
#    diff >  0                  -> "high"  (or "very_high" when diff > 10)
#    diff <  0                  -> "low"   (or "very_low" when diff < -10)
#
#  Example scenario: with skyline_sword viewable (e.g. as the previewed item)
#  and a weapon in the player's MAIN_HAND whose attack_damage is 10:
#    attack_damage  skyline 20 vs hand 10  -> diff 10  -> "high"
#    attack_speed   skyline  7 vs hand  6  -> diff  1  -> "very_low"
# ─────────────────────────────────────────────────────────────
comparable_sword:
  sertraline:
    tier: S
    lore-format: comparable_format
    compare-path: MAIN_HAND
    vals:
      toggleable_mark: true
  mmo:
    attack_damage: 20
    attack_speed: 7
  xbuilder:
    name: "<!i><#ff6936>comparable Sword"
    material: DIAMOND_SWORD
    lore: |
      <!i><dark_gray><strikethrough>-------------------------
      <!i><gray>Comparing against: <aqua>your MAIN HAND item
      <!i><gray><i>Each attribute line shows its value and, if a target item
      <!i><gray><i>is equipped in that slot, the raw difference vs it.
      <!i><dark_gray><strikethrough>-------------------------
comparable_sword_2:
  sertraline:
    tier: S
    lore-format: comparable_format
    compare-path: MAIN_HAND
    vals:
      toggleable_mark: true
  mmo:
    attack_damage: 10
    attack_speed: 5
  xbuilder:
    name: "<!i><#66CCFF>SECOND comparable Sword"
    material: IRON_SWORD
    lore: |
      <!i><dark_gray><strikethrough>-------------------------
      <!i><gray>
      <!i><dark_gray><strikethrough>-------------------------