switchable_format:
  mode: switch
  overwriteable-settings:
    overwrite: true
    visual: true
    auto-skip-blank: true
  pre-variables:
    # 预编译 JS 表达式，结果绑定到变量供下方 when 条件使用
    # Pre-compiled JS expressions; results are bound for fork conditions to use
    loreMode: DataUtil.getDataAsInt(player, "loreMode")
  when:
    # 从上到下依次判断，匹配第一个条件后应用对应的子格式
    # Evaluated top-to-bottom; the first match selects the target format
    - if: loreMode == 0
      then: switchable_attribute
    - if: loreMode == 1
      then: switchable_lore
    # 无 if 条件的条目作为默认兜底 | No if-condition = default fallback
    - then: switchable_misc


switchable_attribute:
  # settings: {}  # 继承自上级格式的 overwriteable-settings | Inherits from parent's overwriteable-settings
  elements:
    - content: ""
    - content: "<green>LORE MODE: ATTRIBUTE"
    - content: "<yellow>TIP: MMO ATTRIBUTE REQUIRES MMO PLUGIN."
    - content: "<yellow>CHECK WIKI FOR MORE INFO."
    - content: ""
    - key: "mmo:ATTACK_DAMAGE"
      content: "<!i><#777777>| <#ff6936>Attack Damage: {plus}{minus}{auto}"
    - key: "mmo:ATTACK_SPEED"
      content: "<!i><#777777>| <#66ccff>Attack Speed: {plus}{minus}{auto}"
switchable_lore:
  # settings: {}
  elements:
    - content: ""
    - content: "<green>LORE MODE: LORE"
    - key: "xbuilder:lore"
      content: "<!i><#999999>| {value}"
    - key: "sertraline:type"
      content: "<!i><#AAAAAA>| <#cccccc>Type: {type:name}"
    - key: "sertraline:tier"
      content: "<!i><#AAAAAA>| <#cccccc>Tier: {tier:format}"
    - key: "sertraline:level"
      content: "<!i><#AAAAAA>| <#cccccc>Level: {level:name}"
switchable_misc:
  # settings: {}
  elements:
    - content: " "
    - content: "<green>LORE MODE: MISC"
    - content: "<gold>Some misc lore here!"
    - content: "<aqua>It's Made by sertraline!"