loreformat:
  settings:
    # 覆盖原版Lore | Overwrite the original lore
    overwrite: true
    # 发包模式（true=基于发包，false=直接更新物品Lore）
    # true = packet-based (client-side view), false = directly updates the item lore
    visual: true
    # 合并连续空行 | Collapse consecutive blank lines into one
    auto-skip-blank: true
  elements:
    # 未指定key时该行始终显示 | Renders unconditionally when no key is set
    - content: "<#aabbcc>--------------------"
    # 如果key指向列表，每个元素依次格式化 | List values are formatted per-element
    - key: "xbuilder:lore"
      content: "<!i><#999999>| {value}"
    - key: "sertraline:type"
      content: "<!i><#AAAAAA>| <#cccccc>Type: {type:name}"
    # {tier:id}, {tier:name}, {tier:desc}, {tier:color}, {tier:weight}
    - key: "sertraline:tier"
      content: "<!i><#AAAAAA>| <#cccccc>Tier: {tier:format}"
    - key: "sertraline:level"
      content: "<!i><#AAAAAA>| <#cccccc>Level: {level:name}"
    # 单项时转为字符串填入{value}；正数时{plus}替换为"+"，负数时{minus}替换为"-"（可在config.yml定制）
    # Single value → {value} is the string form; {plus}/{minus} show "+"/"-" for positive/negative numbers
    - key: "mmo:attack-damage"
      content: "<aqua>Attack Damage {plus}{minus}{value}"
    # *前缀从物品配置文件直接读取，而非dataMap | *prefix reads from the item config tree, not the data map
    - key: "*sertraline.vals.custom"
      content: "<aqua>Custom Val <gray>{plus}{value}"
    - content: "Effects:"
      # ANY:     至少一个key存在时显示 | Displays if at least one required key exists
      # ALL:     所有key都存在时才显示 | Displays only if all required keys exist
      # NOT:     所有key都不存在时才显示 | Displays only if none of the required keys exist
      # NOT_ALL: 至少一个key不存在时显示 | Displays if at least one required key does not exist
      lineMode: ANY
      lineRequire:
        - "*sertraline.vals.effect"
    - key: "minecraft:food.nutrition"
      content: "<!i><#AAAAAA>| <gold>Hunger <#aabbcc>{plus}{minus}{auto}"
    - key: "minecraft:food.saturation"
      content: "<!i><#AAAAAA>| <gold>Saturation <#aabbcc>{plus}{minus}{auto}"
    - content: "<#aabbcc>--------------------"

miscloreformat:
  settings:
    # 覆盖原版Lore | Overwrite the original lore
    overwrite: true
    # 发包模式（true=基于发包，false=直接更新物品Lore）
    # true = packet-based (client-side view), false = directly updates the item lore
    visual: false
    # 合并连续空行 | Collapse consecutive blank lines into one
    auto-skip-blank: true
  elements:
    - content: "<#aabbcc>--------------------"
    - key: "xbuilder:lore"
      content: "<!i><#cccccc>| {value}"
    - content: ""
    - key: "*sertraline.vals.hiddenlore"
      content: "<!i><#777777>| {value}"
    - content: ""
    - key: "sertraline:tier"
      content: "<!i><white>Item Tier: <blue>{value}"
    - content: "<#aabbcc>--------------------"

mmolore:
  settings:
    overwrite: true
    visual: false
    auto-skip-blank: true
  elements:
    - content: ""
    - key: "*sertraline.vals.lore"
      content: "<!i><#cccccc>| {value}"
    - key: "*sertraline.vals.graylore"
      content: "<!i><#777777>| {value}"
    - content: ""
    - key: "mmo:ATTACK_DAMAGE"
      # {auto} 自动取整（如 114.514→114.514, 66.0→66）| Auto-rounds the value
      content: "<!i><#777777>| <#ff6936>Attack Damage: {plus}{minus}{auto}"