# 副手切换示例 — 切换物品显示模式（基于 InventoryClickEvent）
# Offhand toggle sample — listen to InventoryClickEvent with SWAP_OFFHAND / HOTBAR_SWAP
#
# 说明 / Notes:
#   底层 InventoryClickEvent 覆盖了多种"交换物品"的触发方式。
#   The lower-level InventoryClickEvent covers multiple ways to trigger an item swap:
#     - ClickType.SWAP_OFFHAND   按下 F 键（交换主/副手） / press F (swap main/off hand)
#     - ClickType.HOTBAR_SWAP    按数字键 1-9 交换物品到主手 / press number key 1-9 to swap to main hand
#   async: false 保证事件在同步线程执行，setCancelled(true) 才生效。
#   async: false keeps the script on the sync thread so setCancelled(true) takes effect.
#
#   toggleable_mark 取自物品数据中的 val（通过 SertralineAPI.getVal 读取），
#   toggleable_mark is read from the item's val via SertralineAPI.getVal;
#   若物品没有该标记，则不进入切换逻辑，正常放行交换。
#   if the item lacks this mark, the swap proceeds normally without toggling.
#

offhand_meta_toggle:
  bind: "InventoryClickEvent"
  async: false
  eval:
    graaljs: |
      var clickType = event.getClick()
      if (clickType.toString() == "SWAP_OFFHAND") {
        var item = event.getCurrentItem()
        var mark = SertralineAPI.getVal(SertralineAPI.getItemFromStack(item), "toggleable_mark")
        if (mark != null) {
          event.setCancelled(true)
          var currentLoreData = DataUtil.getDataAsInt(player, "loreMode")
          if (currentLoreData == null) {
            DataUtil.setData(player, "loreMode", 0)
          } else {
            if (currentLoreData >= 2) {
              DataUtil.setData(player, "loreMode", 0)
            } else {
              DataUtil.setData(player, "loreMode", currentLoreData + 1)
            }
          }
        }
      }